name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/harness/package-lock.json

      - name: Install harness dependencies
        run: npm ci --prefix tests/harness

      - name: Validate extension
        run: ./validate.sh
